<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WC2026 – World Cup 2026</title>
  <meta name="description" content="World Cup 2026 teams, groups, and match schedule.">
  <link rel="stylesheet" href="css/main.css">

  <!--
    T002: teams.js registers the Alpine component via 'alpine:init' event.
    It must appear before the Alpine CDN script so the listener is wired first.
    Both scripts are deferred; document order guarantees teams.js executes first.
  -->
  <script type="module" src="js/teams.js"></script>
  <script type="module" src="js/groups.js"></script>
  <script type="module" src="js/schedule.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>
<body>

  <header class="site-header">
    <div class="site-header__inner">
      <h1 class="site-title">⚽ World Cup 2026</h1>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="#teams" class="nav-link nav-link--active">Teams</a>
        <a href="#groups" class="nav-link">Groups</a>
        <a href="#schedule" class="nav-link">Schedule</a>
      </nav>
    </div>
  </header>

  <main class="site-main">

    <!--
      Teams Section (T007, T008, T009)
      x-data mounts the teamsSection Alpine component; init() is auto-called.
    -->
    <section id="teams" class="section" x-data="teamsSection" aria-labelledby="teams-heading">
      <h2 id="teams-heading" class="section-title">Teams</h2>

      <!-- T008: Loading state -->
      <div class="loading-state" x-show="isLoading" x-cloak aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <p class="loading-text">Loading teams…</p>
      </div>

      <!-- T009: Error state -->
      <div class="error-state" x-show="hasError && !isLoading" x-cloak role="alert">
        <p class="error-icon" aria-hidden="true">⚠️</p>
        <p class="error-message" x-text="errorMessage"></p>
        <button
          class="btn btn--retry"
          x-on:click="retry()"
          aria-label="Retry loading teams"
        >Try Again</button>
      </div>

      <!-- Teams content: filter bar + grid (shown when data is ready) -->
      <div x-show="!isLoading && !hasError" x-cloak>

        <!-- T015, T016, T019: Filter controls — chips + search + clear -->
        <div class="filter-controls" x-show="allTeams.length > 0">

          <!-- T015: Confederation chip buttons -->
          <div class="chip-bar" role="group" aria-label="Filter by confederation">
            <template x-for="chip in availableConfederations" :key="chip.key">
              <button
                class="chip"
                :class="{ 'chip--active': activeConfederation === chip.key }"
                x-on:click="selectChip(chip.key)"
                :aria-pressed="String(activeConfederation === chip.key)"
                x-text="chip.label"
              ></button>
            </template>
          </div>

          <!-- T019: Search input + T016: Clear button -->
          <div class="search-row">
            <label for="team-search" class="sr-only">Search teams by name</label>
            <input
              id="team-search"
              type="search"
              class="search-input"
              x-model="searchQuery"
              placeholder="Search teams…"
            >
            <button
              class="btn btn--clear"
              x-show="isFiltered"
              x-cloak
              x-on:click="clearFilters()"
              aria-label="Clear all filters"
            >Clear</button>
          </div>

        </div>

        <!-- No-results message -->
        <p
          class="no-results"
          x-show="!hasResults"
          x-cloak
          role="status"
          aria-live="polite"
        >No teams match your filters.</p>

        <!-- T007: Team card grid -->
        <div class="teams-grid" x-show="hasResults" x-cloak>
          <template x-for="team in filteredTeams" :key="team.code || team.name">
            <article class="team-card">
              <div class="team-card__flag" aria-hidden="true" x-text="team.flagEmoji"></div>
              <h3 class="team-card__name" x-text="team.name"></h3>
              <p
                class="team-card__confederation"
                x-text="team.confederation + ' – ' + team.region"
              ></p>
              <p class="team-card__group">
                Group&nbsp;<span x-text="team.group"></span>
              </p>
            </article>
          </template>
        </div>

      </div>
    </section>

    <!-- Groups Section (T003, T004) -->
    <section id="groups" class="section" x-data="groupsSection" aria-labelledby="groups-heading">
      <h2 id="groups-heading" class="section-title">Groups</h2>

      <!-- Loading state -->
      <div class="loading-state" x-show="isLoading" x-cloak aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <p class="loading-text">Loading groups…</p>
      </div>

      <!-- Error state -->
      <div class="error-state" x-show="hasError && !isLoading" x-cloak role="alert">
        <p class="error-icon" aria-hidden="true">⚠️</p>
        <p class="error-message" x-text="errorMessage"></p>
        <button
          class="btn btn--retry"
          x-on:click="retry()"
          aria-label="Retry loading groups"
        >Try Again</button>
      </div>

      <!-- Groups content (shown when data is ready) -->
      <div x-show="!isLoading && !hasError" x-cloak>
        <div class="groups-grid">
          <template x-for="group in groupedTeams" :key="group.id">
            <article class="group-panel">
              <h3 class="group-panel__title">
                Group&nbsp;<span x-text="group.id"></span>
              </h3>
              <ul class="team-list">
                <template x-for="team in group.teams" :key="team.code">
                  <li class="team-row">
                    <span class="team-row__flag" aria-hidden="true" x-text="team.flagEmoji"></span>
                    <span class="team-row__name" x-text="team.name"></span>
                    <span
                      class="team-row__confederation"
                      x-text="team.confederation + ' – ' + team.region"
                    ></span>
                  </li>
                </template>
              </ul>
            </article>
          </template>
        </div>
      </div>

    </section>

  </main>

    <!-- Schedule Section (T004, T005) -->
    <section id="schedule" class="section" x-data="scheduleSection" aria-labelledby="schedule-heading">
      <h2 id="schedule-heading" class="section-title">Schedule</h2>

      <!-- Loading state -->
      <div class="loading-state" x-show="isLoading" x-cloak aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <p class="loading-text">Loading schedule…</p>
      </div>

      <!-- Error state -->
      <div class="error-state" x-show="hasError && !isLoading" x-cloak role="alert">
        <p class="error-icon" aria-hidden="true">⚠️</p>
        <p class="error-message" x-text="errorMessage"></p>
        <button
          class="btn btn--retry"
          x-on:click="retry()"
          aria-label="Retry loading schedule"
        >Try Again</button>
      </div>

      <!-- Schedule content (shown when data is ready) -->
      <div x-show="!isLoading && !hasError" x-cloak>

        <!-- Day filter -->
        <div class="day-filter-bar" x-show="allMatches.length > 0">
          <label for="day-select" class="sr-only">Filter by day</label>
          <select
            id="day-select"
            class="day-select"
            x-model="selectedDay"
            aria-label="Filter matches by day"
          >
            <option value="">All days</option>
            <template x-for="day in availableDays" :key="day.value">
              <option :value="day.value" x-text="day.label"></option>
            </template>
          </select>
        </div>

        <!-- No-results message (day filter active with no matches) -->
        <p
          class="no-results"
          x-show="!hasResults"
          x-cloak
          role="status"
          aria-live="polite"
        >No matches on this day.</p>

        <!-- Day groups -->
        <div class="schedule-days" x-show="hasResults" x-cloak>
          <template x-for="group in filteredDayGroups" :key="group.date">
            <div class="day-group">
              <h3 class="day-group__header" x-text="group.label"></h3>
              <div class="day-group__matches">
                <template x-for="match in group.matches" :key="match.date + match.team1 + match.team2">
                  <article class="match-card">
                    <span class="match-card__round" x-text="match.round"></span>
                    <div class="match-teams">
                      <div class="match-team">
                        <span class="match-team__flag" aria-hidden="true" x-text="match.team1Flag || '🌐'"></span>
                        <span class="match-team__name" x-text="match.team1"></span>
                      </div>
                      <span class="match-team--vs">vs</span>
                      <div class="match-team">
                        <span class="match-team__name" x-text="match.team2"></span>
                        <span class="match-team__flag" aria-hidden="true" x-text="match.team2Flag || '🌐'"></span>
                      </div>
                    </div>
                    <div class="match-times">
                      <div class="match-time">
                        <span class="match-time__label" x-text="userTimezone"></span>
                        <span class="match-time__value" x-text="formatLocalTime(match.utcDate)"></span>
                      </div>
                      <div class="match-time">
                        <span class="match-time__label" x-text="match.ground"></span>
                        <span class="match-time__value" x-text="formatVenueTime(match.utcDate, match.venueTimezone)"></span>
                      </div>
                    </div>
                  </article>
                </template>
              </div>
            </div>
          </template>
        </div>

      </div>
    </section>

  <footer class="site-footer">
    <p>
      Data:
      <a
        href="https://github.com/openfootball/worldcup.json"
        target="_blank"
        rel="noopener noreferrer"
      >openfootball/worldcup.json</a>
    </p>
  </footer>

</body>
</html>
